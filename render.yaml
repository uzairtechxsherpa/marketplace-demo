services:
  - type: web
    name: aether-marketplace
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MARKETPLACE_MODE
        value: mock
      - key: PRODUCT_NAME
        value: Aether
      - key: MARKETPLACE_OFFER_ID
        value: aether-saas-dev
